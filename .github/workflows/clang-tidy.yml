name: clang-tidy

on:
  push:
    branches: [main, "rewrite/**", "hardening/**", "finishing/**", "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: clang-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: clang-tidy / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy ninja-build

      - name: Configure CMake (export compile_commands.json)
        run: cmake -S . -B build/tidy -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build (so headers exist for analyzers)
        run: cmake --build build/tidy

      - name: Run clang-tidy on library sources
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
              'src/*.cpp' 'src/**/*.cpp')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No source files to analyze."
            exit 0
          fi
          clang-tidy -p build/tidy --warnings-as-errors='' "${files[@]}"
