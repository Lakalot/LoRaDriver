name: Arduino IDE compile

on:
  push:
    branches: [main, "rewrite/**", "hardening/**", "finishing/**", "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: arduino-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-examples:
    name: Compile examples (esp32:esp32:esp32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arduino/compile-sketches' `source-path: ./` symlink installs the
      # repo as a library, but when the sketches being compiled live inside
      # that same repo (under examples/), arduino-cli ends up not seeing
      # LoRaDriver as a separate installable. Pre-copy the lib into the
      # Arduino user-libraries dir and leave the `libraries:` input empty.
      - name: Pre-install LoRaDriver into Arduino libraries dir
        run: |
          set -euo pipefail
          DEST="$HOME/Arduino/libraries/LoRaDriver"
          mkdir -p "$DEST"
          cp -r src examples library.json library.properties \
                README.md CHANGELOG.md \
                "$DEST/"
          echo "Installed structure:"
          find "$DEST" -maxdepth 3 -print | head -40

      - name: Compile sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.0.7
          libraries: |
            []
          sketch-paths: |
            - examples/BasicSender
            - examples/BasicReceiver
            - examples/Esp32WithPumpTask
            - examples/MultiInstance
          enable-deltas-report: false
          verbose: true
          cli-compile-flags: |
            - --warnings=default
            - --libraries
            - /home/runner/Arduino/libraries
