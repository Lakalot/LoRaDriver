name: Arduino IDE compile

on:
  push:
    branches: [main, "rewrite/**", "hardening/**", "finishing/**", "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: arduino-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-examples:
    name: Compile examples (esp32:esp32:esp32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.0.7
          libraries: |
            - source-path: ./
              name: LoRaDriver
          sketch-paths: |
            - examples/BasicSender
            - examples/BasicReceiver
            - examples/Esp32WithPumpTask
            - examples/MultiInstance
          enable-deltas-report: false
          verbose: true
          cli-compile-flags: |
            - --warnings=default
