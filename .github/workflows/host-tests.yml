name: Host tests

on:
  push:
    branches: [main, "rewrite/**", "hardening/**", "finishing/**"]
  pull_request:
    branches: [main]

# Ubuntu-only matrix to stay within the free GitHub Actions tier
# (Linux is unmetered on public repos; Windows = 2x and macOS = 10x billable).
# The MSVC -fno-exceptions and Linux gcc -fno-exceptions paths are exercised
# locally before each merge — see docs/api.md.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build/host

      - name: Build
        run: cmake --build build/host --config Debug

      - name: Run host tests
        run: ctest --test-dir build/host -C Debug --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with sanitizers
        run: cmake -S . -B build/asan -DLORADRIVER_SANITIZERS=ON
      - name: Build
        run: cmake --build build/asan
      - name: Run
        run: ctest --test-dir build/asan --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get install -y clang-format
      - name: Run clang-format check
        run: ./tools/lint.sh
