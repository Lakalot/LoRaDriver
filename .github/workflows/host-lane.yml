name: Host Lane

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default --output-on-failure

      - name: Evaluate Quality Gates
        id: gate-eval
        run: |
          echo "=== Quality Gate Evaluation ==="

          # Run CI gate engine deterministic tests (gate rule + threshold verification)
          if ! ctest --preset default --tests-regex "^ci_gates$" --output-on-failure; then
            echo "::error::CI gate engine test failed - blocking gates not verified"
            exit 1
          fi
          echo "CI gate engine: PASSED"

          # Run OTA rollout gate deterministic tests (telemetry quality, trend, block/hold/allow)
          if ! ctest --preset default --tests-regex "^ota_gate$" --output-on-failure; then
            echo "::error::OTA gate engine test failed - rollout decision logic not verified"
            exit 1
          fi
          echo "OTA gate engine: PASSED"

          echo ""
          echo "=== Blocking Quality Gates Evaluated (V1) ==="
          echo "  INIT-001:        init_success_rate >= 99%        [evaluated by CI + OTA gate engines]"
          echo "  INIT-002:        init_time_p99 <= 500ms          [evaluated by CI gate engine]"
          echo "  TXRX-001:        tx_success_rate >= 99%          [evaluated by CI + OTA gate engines]"
          echo "  TXRX-002:        rx_success_rate >= 98%          [evaluated by CI + OTA gate engines]"
          echo "  IRQ-001:         irq_handled_rate >= 99.9%       [evaluated by CI gate engine]"
          echo "  IRQ-002:         irq_overflow_count == 0         [evaluated by CI + OTA gate engines]"
          echo "  TIMEOUT-001:     recovery_success_rate >= 99%    [evaluated by CI gate engine]"
          echo "  RECOVERY-001:    sleep_wakeup_success >= 99%     [evaluated by CI gate engine]"
          echo "  RECOVERY-002:    timeout_recovery >= 100%        [evaluated by CI gate engine]"
          echo "  INTEGRATION-001: fsm_deadlock_count == 0         [evaluated by CI gate engine]"
          echo "  NONREG-001:      suite_pass_rate >= 100%         [evaluated by CI gate engine]"
          echo ""
          echo "=== OTA Rollout Gate Policy ==="
          echo "  Rollout decisions: allow / hold / block"
          echo "  Data quality checks: firmware_version, radio_family, active_band,"
          echo "    init_failure_rate, timeout_events, irq_overflow_events,"
          echo "    tx_success_rate, rx_success_rate, sample_timestamp_utc"
          echo "  Trend degradation threshold: 2pp drop from baseline triggers hold"
          echo ""
          echo "All gate engine tests executed and PASSED."
          echo "gate_result=pass" >> $GITHUB_OUTPUT

      - name: Gate Failure Block
        if: steps.gate-eval.outputs.gate_result != 'pass'
        run: |
          echo "::error::Blocking quality gate failed - merge denied"
          exit 1
