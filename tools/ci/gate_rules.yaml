# CI Quality Gate Rules Configuration
# Version: 1.0.0
# Generated: 2026-02-26
# 
# This file defines the blocking quality gates for LoRaDriver releases.
# Gates are evaluated by the CiGateEngine during CI pipeline execution.
#
# Severity Levels:
#   - blocking: Merge/release denied on failure
#   - warning: Logged but does not block
#   - advisory: Informational only
#
# Categories:
#   - init: Radio initialization scenarios
#   - txrx: Transmission/reception scenarios
#   - irq: IRQ handling scenarios
#   - timeout: Timeout and recovery scenarios
#   - recovery: Sleep/wakeup recovery scenarios
#   - integration: Cross-cutting integration scenarios

gates:
  - id: INIT-001
    category: init
    severity: blocking
    threshold:
      metric: init_success_rate
      operator: ">="
      value: 99.0
      unit: percent
    description: "Radio init success rate must be >= 99%"

  - id: INIT-002
    category: init
    severity: blocking
    threshold:
      metric: init_time_p99
      operator: "<="
      value: 500
      unit: ms
    description: "Init latency P99 must be <= 500ms"

  - id: TXRX-001
    category: txrx
    severity: blocking
    threshold:
      metric: tx_success_rate
      operator: ">="
      value: 99.0
      unit: percent
    description: "TX success rate must be >= 99%"

  - id: TXRX-002
    category: txrx
    severity: blocking
    threshold:
      metric: rx_success_rate
      operator: ">="
      value: 98.0
      unit: percent
    description: "RX success rate must be >= 98%"

  - id: IRQ-001
    category: irq
    severity: blocking
    threshold:
      metric: irq_handled_rate
      operator: ">="
      value: 99.9
      unit: percent
    description: "IRQ handling rate must be >= 99.9%"

  - id: IRQ-002
    category: irq
    severity: blocking
    threshold:
      metric: irq_overflow_count
      operator: "=="
      value: 0
      unit: count
    description: "No IRQ overflow allowed"

  - id: TIMEOUT-001
    category: timeout
    severity: blocking
    threshold:
      metric: recovery_success_rate
      operator: ">="
      value: 99.0
      unit: percent
    description: "Timeout recovery rate must be >= 99%"

  - id: RECOVERY-001
    category: recovery
    severity: blocking
    threshold:
      metric: sleep_wakeup_success
      operator: ">="
      value: 99.0
      unit: percent
    description: "Sleep/wakeup recovery must be >= 99%"

  - id: INTEGRATION-001
    category: integration
    severity: blocking
    threshold:
      metric: fsm_deadlock_count
      operator: "=="
      value: 0
      unit: count
    description: "No FSM deadlock allowed"

  - id: RECOVERY-002
    category: recovery
    severity: blocking
    threshold:
      metric: timeout_recovery_success_rate
      operator: ">="
      value: 100
      unit: percent
    description: "All validated profiles must have timeout recovery evidence"

  - id: NONREG-001
    category: integration
    severity: blocking
    threshold:
      metric: suite_pass_rate
      operator: ">="
      value: 100
      unit: percent
    description: "All non-regression cases must pass"

# Channel Policies
# Defines which gates are required for each release channel
channels:
  regular:
    required_gates:
      - INIT-001
      - INIT-002
      - TXRX-001
      - TXRX-002
      - IRQ-001
      - IRQ-002
      - TIMEOUT-001
      - RECOVERY-001
      - RECOVERY-002
      - INTEGRATION-001
      - NONREG-001
    allow_waivers: true
    waiver_approvers:
      - release-owner
      - tech-lead

  hotfix:
    required_gates:
      - INIT-001
      - INIT-002
      - TXRX-001
      - TXRX-002
      - IRQ-001
      - IRQ-002
      - TIMEOUT-001
      - RECOVERY-001
      - RECOVERY-002
      - INTEGRATION-001
      - NONREG-001
    allow_waivers: true
    waiver_approvers:
      - release-owner
      - tech-lead
      - incident-commander

# OTA Rollout Gate Policy (Story 4.1)
# =====================================
# Decisions evaluated by OtaGateEngine from field telemetry snapshots.
# Reuses CI gate thresholds (INIT-001, TXRX-001, TXRX-002, IRQ-002) for KPI checks.
# Additional: telemetry data-quality checks and KPI trend degradation detection.
#
# OTA Decision Values:
#   - allow: metrics satisfy thresholds; no negative trend signal
#   - hold:  data quality issue or trend degradation; requires manual escalation
#   - block: blocking CI threshold violated; rollout expansion denied
#
# Minimum required telemetry fields (missing → hold):
#   firmware_version, radio_family, active_band,
#   init_failure_rate, timeout_events, irq_overflow_events,
#   tx_success_rate, rx_success_rate, sample_timestamp_utc

ota_rollout:
  # Gates reused from CI policy (same thresholds, same IDs — no duplication)
  reused_ci_gates:
    - gate_id: INIT-001
      metric_mapping: "init_success_rate = 100 - init_failure_rate"
      decision_on_fail: block
    - gate_id: TXRX-001
      metric_mapping: "tx_success_rate (direct)"
      decision_on_fail: block
    - gate_id: TXRX-002
      metric_mapping: "rx_success_rate (direct)"
      decision_on_fail: block
    - gate_id: IRQ-002
      metric_mapping: "irq_overflow_events (cast to float)"
      decision_on_fail: block

  # OTA-specific quality and trend policy
  quality_policy:
    missing_field_decision: hold
    invalid_range_decision: hold
    stale_timestamp_decision: hold  # sample_timestamp_utc == 0

  trend_policy:
    degradation_threshold_pp: 2.0   # percentage-point drop from baseline triggers hold
    applicable_metrics:
      - tx_success_rate
      - rx_success_rate
      - init_failure_rate   # increase in failure rate = degradation
    decision_on_trend_risk: hold

  # Artifact retention for OTA telemetry evidence
  telemetry_artifact_type: kTelemetryBaseline
  retention_days: 180

# Rollback Governance Policy (Story 4.2)
# =======================================
# Defines when and how rollback to last-known-good baseline is triggered
# and what evidence is required for post-incident review.
#
# Rollback is triggered only by kBlock OTA gate decisions (blocking threshold
# violations). Data-quality holds (kHold + quality_issue) do NOT trigger
# rollback — they represent potential false positives requiring manual review.
#
# Rollback State Machine:
#   requested → precheck → execute → verify → complete | failed
#
# Precheck Requirements (fail-fast; no ambiguous branching):
#   - target_version must be non-empty (LKG candidate registered)
#   - radio_family must be SX1276 or SX1278 (V1 scope only)
#   - active_band must be 433 or 868 (V1 scope only)
#   - trigger_timestamp_utc must be non-zero
#
# Postcheck Requirements:
#   - started_timestamp captured (execution state recorded)
#   - rollback artifact registered and retrievable from ArtifactRegistry
#   - radio_family still V1-compatible post-execution (health snapshot)
#
# Evidence Retention:
#   - Rollback artifacts registered as kRecoveryProof (90–180 days)
#   - Incident linkage via TraceabilityEngine::linkIncidentToArtifact
#   - Timeline checkpoints: triggered, started, completed (UTC epoch)
#   - Incident ID format: RB-{radio_family}-{active_band}-{trigger_timestamp_utc}

rollback_policy:
  # Trigger policy — which OTA decisions initiate rollback
  trigger_conditions:
    - decision: block
      description: "Blocking CI threshold violated; policy-initiated rollback"
    - decision: operator
      description: "Manual operator decision; always triggers regardless of OTA decision"

  # Conditions that must NOT trigger rollback
  no_trigger_conditions:
    - decision: hold
      reason: "Data quality or trend risk — potential false positive; manual escalation only"
    - decision: allow
      reason: "No issue detected; rollback not warranted"

  # Precheck gate requirements (any failure = rollback aborted, state → failed)
  precheck_gates:
    - id: RB-PRE-001
      check: target_version_present
      description: "LKG candidate target_version must be non-empty"
      failure_reason: "precheck-lkg: missing target_version"
    - id: RB-PRE-002
      check: radio_family_v1_compatible
      description: "radio_family must be SX1276 or SX1278"
      failure_reason: "precheck-profile: unsupported radio_family"
    - id: RB-PRE-003
      check: active_band_v1_compatible
      description: "active_band must be 433 or 868"
      failure_reason: "precheck-band: unsupported active_band"
    - id: RB-PRE-004
      check: trigger_timestamp_valid
      description: "trigger_timestamp_utc must be non-zero"
      failure_reason: "precheck-integrity: invalid trigger timestamp"

  # Postcheck gate requirements (any failure = rollback marked failed)
  postcheck_gates:
    - id: RB-POST-001
      check: started_timestamp_captured
      description: "Execution state must be recorded (started_timestamp != 0)"
    - id: RB-POST-002
      check: artifact_registered_and_retrievable
      description: "kRecoveryProof artifact must exist in ArtifactRegistry"
    - id: RB-POST-003
      check: radio_family_health_snapshot
      description: "radio_family and active_band still V1-compatible post-rollback (health check)"

  # Artifact evidence requirements
  artifact_type: kRecoveryProof
  retention_days: 180
  incident_id_format: "RB-{radio_family}-{active_band}-{trigger_timestamp_utc}"

# Release Monitoring Policy (Story 4.3)
# =======================================
# Defines incident tracking, trend analysis, and progressive rollout blocking
# during post-release monitoring windows.
#
# A monitoring window is opened per release with V1 profile context (SX1276/SX1278,
# 433/868 bands). Incidents are recorded and trend-evaluated to gate further rollout.
#
# Decision Precedence (evaluated in order):
#   1. stale_context: window missing or closed → kHold
#   2. trend_breach:  any critical incident recorded → kBlock (RM-TREND-001)
#   3. kpi_breach:    OTA telemetry gate violation (reuses OtaGateEngine) → kBlock
#   4. all_clear:     no blocking condition → kContinue
#
# Auto-policy and operator-policy produce identical BlockDecisionRationale evidence
# schema — source only affects how the decision was initiated, not the evidence format.
#
# Escalation on kBlock:
#   - BlockDecisionRationale::failed_rule_ids[] — blocking rule IDs (e.g. "RM-TREND-001")
#   - BlockDecisionRationale::metric_values[]   — actual measured values
#   - BlockDecisionRationale::thresholds[]      — applicable thresholds
#   - BlockDecisionRationale::artifact_id       — kGateReport artifact for audit
#   - BlockDecisionRationale::trend_breach flag — set when RM-TREND-001 fires
#   - BlockDecisionRationale::kpi_breach flag   — set when OTA gate fails
#
# Window Closure (closeWindow):
#   - Generates ObjectiveComparison for: critical_incidents, high_incidents, total_incidents
#     (all targets = 0.0; objectives_met = true only when all three are zero)
#   - Calibration notes generated for elevated counts; "no adjustment needed" otherwise
#   - kValidationReport artifact registered with 90-day retention
#   - window artifact linked to review artifact via ArtifactRegistry::linkArtifacts
#   - Incident linked to review artifact via TraceabilityEngine::linkIncidentToArtifact

monitoring_policy:
  # Incident-trend block rule — any critical incident triggers an immediate block
  incident_trend_rules:
    - id: RM-TREND-001
      severity_threshold: critical
      count_threshold: 0          # any count > threshold triggers block (i.e. count >= 1)
      decision_on_breach: block
      description: "Any critical-severity incident during monitoring window blocks rollout"
      artifact_type: kGateReport
      artifact_retention_days: 90

  # Severity categories (IncidentCategory enum values)
  incident_categories:
    - id: kRadioInit
      description: "Radio initialization failure"
    - id: kTxFailure
      description: "Transmission failure"
    - id: kRxFailure
      description: "Reception failure"
    - id: kIrqOverflow
      description: "IRQ overflow event"
    - id: kTimeout
      description: "Operation timeout"
    - id: kOther
      description: "Uncategorized incident"

  # Severity levels (IncidentSeverity enum values)
  incident_severities:
    - id: kCritical
      blocks_rollout: true
      rule: RM-TREND-001
    - id: kHigh
      blocks_rollout: false
      monitored: true
    - id: kMedium
      blocks_rollout: false
      monitored: true
    - id: kLow
      blocks_rollout: false
      monitored: true

  # Window lifecycle
  window_lifecycle:
    max_concurrent_windows: 4
    max_incidents_per_window: 64
    artifact_type_on_open: kIncidentEvidence
    artifact_retention_on_open_days: 180
    artifact_type_on_close: kValidationReport
    artifact_retention_on_close_days: 90

  # Window context constraints (V1 scope)
  window_context_constraints:
    supported_radio_families:
      - SX1276
      - SX1278
    supported_bands:
      - "433"
      - "868"
    window_start_utc_required: true
    window_end_utc_must_follow_start: true
    profile_id_required: true

  # Objective thresholds for window review output
  window_review_objectives:
    - metric: critical_incidents
      target: 0.0
    - metric: high_incidents
      target: 0.0
    - metric: total_incidents
      target: 0.0

  # Escalation semantics — identical evidence schema for auto and operator decisions
  decision_sources:
    - id: kAutoPolicy
      description: "Automated policy enforcement"
    - id: kOperatorPolicy
      description: "Manual operator decision"

# Waiver Configuration
waivers:
  max_expiry_hours: 72
  require_justification: true
  audit_retention_days: 365
