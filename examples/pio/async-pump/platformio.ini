; Async LoRa TX with the FreeRTOS pump task — uses the loradriver::lora facade.
;
; This example shows:
;  * lora.send_async() — non-blocking, enqueues into the pump task TX queue
;  * cfg.spi_pins — custom SPI bus pins (e.g. MOSI on GPIO 22)
;  * cfg.pump.* — pump task tuning (priority, stack, core_id)
;
; Copy this directory anywhere, then:
;   pio run --target upload
;   pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags = -std=gnu++17

lib_deps = https://github.com/Lakalot/LoRaDriver.git#v1.3.0
