; Minimal LoRa receiver — uses the loradriver::lora facade.
;
; Copy this directory anywhere, then:
;   pio run --target upload
;   pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags = -std=gnu++17

lib_deps = https://github.com/Lakalot/LoRaDriver.git#v1.3.0
